name: Feature request
description: 提一个功能建议 / Suggest a feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
      description: 描述使用场景，而不只是"加个功能"。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的效果 / Proposed solution
      description: 你希望它长什么样、怎么交互；有草图或参考链接更好。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
    validations:
      required: false
